# See schema in factory_schema_config_base.py for descriptions of parameters.

defaults:
    - _self_
    #- /factory_schema_config_base

mode:
    export_scene: False
    export_states: False

sim:
    dt: 0.016667
    substeps: 2
    up_axis: "z"
    use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
    gravity: [0.0, 0.0, -9.81]
    add_damping: False

    physx:
        solver_type: ${....solver_type}
        num_threads: ${....num_threads}
        num_subscenes: ${....num_subscenes}
        use_gpu: ${contains:"cuda",${....sim_device}}

        num_position_iterations: 16
        num_velocity_iterations: 0
        contact_offset: 0.005
        rest_offset: 0.0
        bounce_threshold_velocity: 0.2
        max_depenetration_velocity: 5.0
        friction_offset_threshold: 0.01
        friction_correlation_distance: 0.00625

        max_gpu_contact_pairs: 1048576  # 1024 * 1024
        default_buffer_size_multiplier: 8.0
        contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

env:
    env_spacing: 0.5
    assembly_center: [0, -0.15, 0]
    kuka_pos: [0.454, 0.1975, -0.00495]  # unchanged from the Franka rig: matches the X/Y already calibrated in real_robot/robot_interface.py's pose_world_to_robot_base() for the KUKA rig
    kuka_euler: [0, 0, -1.559615883383144]  # unchanged: matches the orientation already calibrated in real_robot/robot_interface.py's pose_world_to_robot_base()
    # NOTE: joint4 clipped from the old Franka rest pose (-135deg) to -110deg to respect the
    # iiwa7's tighter +/-119.7deg (+/-2.09rad) limit on joints 2/4/6 (vs. Franka's +/-120deg on
    # joints 2/4/6 -- the difference matters here because Franka's rest pose used -135deg on
    # joint4, past the iiwa7 limit). Not yet verified against the physical dual-arm rig.
    kuka_rest_dof_pos: [0, -0.7853981633974483, 0, -1.9198621771937625, 0, 1.5707963267948966, 0.7853981633974483]
    table_height: 0.4
    kuka_friction: 1.0
    table_friction: 0.3
